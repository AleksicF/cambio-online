# Render Blueprint: https://render.com/docs/blueprint-spec
# Ein Webdienst, der Spielserver und gebauten Client gemeinsam ausliefert.
services:
  - type: web
    name: cambio-online
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
